<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0db7ed"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>
  <!-- Magnifying glass icon over container -->
  <g transform="translate(120, 100)">
    <!-- Container / box -->
    <rect x="-40" y="-20" width="50" height="35" rx="3" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
    <rect x="-34" y="-14" width="10" height="22" rx="1.5" fill="white" opacity="0.3"/>
    <rect x="-20" y="-8" width="10" height="16" rx="1.5" fill="white" opacity="0.3"/>
    <rect x="-6" y="-11" width="10" height="19" rx="1.5" fill="white" opacity="0.3"/>
    <!-- Magnifying glass -->
    <circle cx="12" cy="-12" r="18" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
    <line x1="25" y1="1" x2="38" y2="14" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Search highlight -->
    <circle cx="12" cy="-12" r="12" fill="white" opacity="0.06"/>
  </g>
  <!-- Title -->
  <text x="480" y="90" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">k8s-dockerhub-detector</text>
  <!-- Subtitle -->
  <text x="480" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" opacity="0.8" text-anchor="middle">Detect DockerHub usage in Kubernetes clusters</text>
</svg>
